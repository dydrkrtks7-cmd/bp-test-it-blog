    <rect x="1211" y="192" width="83" height="98" rx="8" fill="#0f172a" opacity="0.15" transform="rotate(30, 62, 47)"/>
    <rect x="539" y="631" width="89" height="76" rx="8" fill="#0f172a" opacity="0.09" transform="rotate(37, 123, 218)"/>
    <rect x="1069" y="713" width="73" height="91" rx="8" fill="#0f172a" opacity="0.11" transform="rotate(14, 240, 527)"/>
    <polygon points="275,489 316,571 234,571" fill="#334155" opacity="0.05"/>
    <polygon points="236,528 298,652 174,652" fill="#334155" opacity="0.04"/>
    <polygon points="446,109 495,207 397,207" fill="#334155" opacity="0.06"/>
    <polygon points="409,506 476,640 342,640" fill="#334155" opacity="0.10"/>

  <!-- Wave at bottom -->
  <path d="M0,554 C360,592 840,516 1200,554 L1200,630 L0,630Z" fill="#334155" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
