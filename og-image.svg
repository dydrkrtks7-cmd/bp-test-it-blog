    <circle cx="826" cy="170" r="82" fill="#334155" opacity="0.11"/>
    <circle cx="100" cy="642" r="75" fill="#334155" opacity="0.18"/>
    <circle cx="72" cy="128" r="40" fill="#334155" opacity="0.07"/>
    <rect x="-76" y="721" width="29" height="93" rx="8" fill="#0f172a" opacity="0.10" transform="rotate(40, 623, 380)"/>
    <rect x="827" y="562" width="41" height="33" rx="8" fill="#0f172a" opacity="0.08" transform="rotate(13, 924, 356)"/>
